<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="assets/css/style.css">
    <title>Metal Mate</title>
  </head>
  <body>
    <main >
        <!-- Header -->
        <header>
            <h1>Metal Mate</h1>
        </header>

        <!-- Main Area -->
        <div id="main-area" >

            <!-- Motivational Heading -->
            <div id="motivational-area" >
                <h3>Check out the latest metal prices.</h3
                <p>Select your metal and currency</p>
            </div>

            <!-- Preferences -->
            <div id="preferences" class="area">
                <div>
                    <label for="metal-choice" >Metal :</label>
                    <select name="metal" id="metal-choice" >
                    </select>
                </div>
                <div>
                    <label for="currency-choice">Currency :</label>
                    <select name="currency" id="currency-choice">
                    </select>
                </div>
            </div>

            

            <!-- Price Area -->
            <div class="area hide" id="price-area">
                <div style="text-align: center;">
                    <label>Spot Price:
                        <span id="spot-price">0</span>
                    </label>
                </div>
                <div style="text-align: center;">
                    <label>Exchange Rate:
                        <span id="exchange-rate">0</span>
                    </label>
                </div>
                <div style="text-align: center;">
                    <label>Updated At:
                        <span id="updated-at">0</span>
                    </label>
                </div>
            </div>

            <!-- Button Area -->
            <div id="button-area" >
                <button type="submit" id="button">Update Prices</button>
            </div>

        </div>

    </main>
    <script src="assets/js/script.js"></script>
  </body>
</html>
